<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimal Layered Shield Logo -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#a371d7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58d4a8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Shield (Ledger - Gold) -->
  <path d="M 100 30 L 160 60 L 160 110 Q 100 160 100 160 Q 100 160 40 110 L 40 60 Z"
        fill="none" stroke="#d4a574" stroke-width="3" stroke-linejoin="round"/>

  <!-- Middle Shield (Witness - Violet) -->
  <path d="M 100 50 L 140 70 L 140 110 Q 100 150 100 150 Q 100 150 60 110 L 60 70 Z"
        fill="none" stroke="#a371d7" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Shield (Circuit - Teal) -->
  <path d="M 100 70 L 120 82 L 120 110 Q 100 135 100 135 Q 100 135 80 110 L 80 82 Z"
        fill="#58d4a8" stroke="#58d4a8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Verification checkmark in center -->
  <g transform="translate(100, 95)">
    <path d="M -8 0 L -2 6 L 8 -4" stroke="white" stroke-width="2.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>